[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-energy-baseline"
version = "0.1.0"
description = "Herramienta open source para establecer, mantener, evaluar y auditar líneas base energéticas industriales."
readme = "README.md"
authors = [
  { name = "Loren", email = "lorenhey@github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.2.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pint>=0.22",
    "streamlit>=1.28.0",
    "plotly>=5.15.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0"
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
    "mypy>=1.0"
]

[project.scripts]
ieb = "industrial_energy_baseline.cli.main:app"

[tool.setuptools.packages.find]
include = ["industrial_energy_baseline*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
